server:
  port: ${SERVER_PORT:8085}

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties],optional:file:promotion-affiliate-service/.env[.properties]
  application:
    name: promotion-affiliate-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/promotion_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/scanms}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

clients:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8083}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
scanms:
  commission:
    default-policy-enabled: ${COMMISSION_DEFAULT_POLICY_ENABLED:true}
  finance:
    token-url: ${FINANCE_TOKEN_URL:}
    client-id: ${AFFILIATE_SERVICE_CLIENT_ID:promotion-affiliate-service}
    client-secret: ${AFFILIATE_SERVICE_CLIENT_SECRET:}
    dispatch-delay-ms: ${FINANCE_DISPATCH_DELAY_MS:60000}

# Trang Giám sát hệ thống: chỉ mở các endpoint cần thiết; health không lộ chi tiết, hai endpoint scanms* chỉ cho ADMIN/SYSTEM_ADMIN.
management:
  endpoints:
    web:
      exposure:
        include: health,scanmsinfo,scanmslogs
  endpoint:
    health:
      show-details: never
  # Redis và mail chỉ là phần phụ (cache, gửi thư): lỗi thì service hạ cấp chứ không "DOWN". Trạng thái Redis xem ở scanmsinfo.
  health:
    redis:
      enabled: false
    mail:
      enabled: false
