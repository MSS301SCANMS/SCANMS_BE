server:
  port: ${SERVER_PORT:8084}

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties],optional:file:payment-service/.env[.properties]
  application:
    name: payment-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/payment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/scanms}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

scanms:
  payment:
    sandbox-enabled: ${PAYMENT_SANDBOX_ENABLED:false}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    bank-encryption-key: ${BANK_ENCRYPTION_KEY:}
    bank-closed-dates: ${BANK_CLOSED_DATES:}
    minimum-withdrawal-vnd: ${MINIMUM_WITHDRAWAL_VND:200000}
    automatic-payouts: ${AUTOMATIC_PAYOUTS:true}
    payout-delay-ms: ${PAYOUT_DELAY_MS:60000}
    service-token-url: ${PAYMENT_SERVICE_TOKEN_URL:}
    service-client-id: ${PAYMENT_SERVICE_CLIENT_ID:payment-service}
    service-client-secret: ${PAYMENT_SERVICE_CLIENT_SECRET:}
    payos:
      base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}
      payout-client-id: ${PAYOS_PAYOUT_CLIENT_ID:}
      payout-api-key: ${PAYOS_PAYOUT_API_KEY:}
      payout-checksum-key: ${PAYOS_PAYOUT_CHECKSUM_KEY:}
clients:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8083}
  promotion:
    url: ${PROMOTION_SERVICE_URL:http://localhost:8085}

# Trang Giám sát hệ thống: chỉ mở các endpoint cần thiết; health không lộ chi tiết, hai endpoint scanms* chỉ cho ADMIN/SYSTEM_ADMIN.
management:
  endpoints:
    web:
      exposure:
        include: health,scanmsinfo,scanmslogs
  endpoint:
    health:
      show-details: never
  # Redis và mail chỉ là phần phụ (cache, gửi thư): lỗi thì service hạ cấp chứ không "DOWN". Trạng thái Redis xem ở scanmsinfo.
  health:
    redis:
      enabled: false
    mail:
      enabled: false
