server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties],optional:file:user-service/.env[.properties]
  application:
    name: user-service
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Timeout ngắn: Redis lỗi thì cache bị bỏ qua nhanh, request vẫn đọc DB.
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
      properties:
        # Broker tắt thì KafkaAdmin bỏ cuộc nhanh, không chặn việc khởi động service.
        request.timeout.ms: 2000
        default.api.timeout.ms: 2000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:3000}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${USER_DB_PORT:5433}/${USER_DB_NAME:user_db}}
    username: ${DB_USERNAME:${POSTGRES_USER:postgres}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/scanms}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:demo@example.com}
    password: ${MAIL_PASSWORD:demo}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
keycloak:
  auth-server-url: http://localhost:8180
  realm: scanms
  client-id: scanms-client
  client-secret: ${CLIENT_SECRET:4PZDQzhZgoKdMyepscQBtEk2SnFwC8j7}

app:
  auth:
    # false (mac dinh) = che do test: user moi tao duoc set emailVerified=true ngay, khong gui mail.
    # true = bat thuc su: user moi tao emailVerified=false + Keycloak tu gui mail xac minh (can da cau hinh SMTP trong Keycloak).
    email-verification-enabled: ${EMAIL_VERIFICATION_ENABLED:false}
google:
  # Default khớp VITE_GOOGLE_CLIENT_ID trên FE; override bằng env GOOGLE_CLIENT_ID khi cần.
  client-id: ${GOOGLE_CLIENT_ID:281102364785-etm73id59t8qvrbgrd16gpqg12plr21b.apps.googleusercontent.com}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:demo}
  api-secret: ${CLOUDINARY_API_SECRET:demo}
