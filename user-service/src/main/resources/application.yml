server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import: optional:file:.env[.properties],optional:file:user-service/.env[.properties]
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${USER_DB_PORT:5433}/${USER_DB_NAME:user_db}}
    username: ${DB_USERNAME:${POSTGRES_USER:postgres}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/scanms}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
keycloak:
  auth-server-url: http://localhost:8180
  realm: scanms
  client-id: scanms-client
  client-secret: ${CLIENT_SECRET}
