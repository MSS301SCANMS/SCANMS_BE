server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/order_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/scanms}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

clients:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  promotion:
    url: ${PROMOTION_SERVICE_URL:http://localhost:8085}
scanms:
  finance:
    token-url: ${FINANCE_TOKEN_URL:}
    client-id: ${ORDER_SERVICE_CLIENT_ID:order-service}
    client-secret: ${ORDER_SERVICE_CLIENT_SECRET:}
    dispatch-delay-ms: ${FINANCE_DISPATCH_DELAY_MS:60000}
  checkout:
    shipping-fee-per-store-vnd: ${CHECKOUT_SHIPPING_FEE_PER_STORE_VND:0}
