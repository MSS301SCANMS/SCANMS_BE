server:
  port: ${SERVER_PORT:8083}

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties],optional:file:order-service/.env[.properties]
  application:
    name: order-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Timeout ngắn: Redis lỗi thì cache bị bỏ qua nhanh, request vẫn đọc DB.
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/order_db}
    username: ${DB_USERNAME:${POSTGRES_USER:postgres}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/scanms}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

clients:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  promotion:
    url: ${PROMOTION_SERVICE_URL:http://localhost:8085}
scanms:
  finance:
    token-url: ${FINANCE_TOKEN_URL:}
    client-id: ${ORDER_SERVICE_CLIENT_ID:order-service}
    client-secret: ${ORDER_SERVICE_CLIENT_SECRET:}
    dispatch-delay-ms: ${FINANCE_DISPATCH_DELAY_MS:60000}
  checkout:
    shipping-provider: ${CHECKOUT_SHIPPING_PROVIDER:FIXED}
    shipping-fee-per-store-vnd: ${CHECKOUT_SHIPPING_FEE_PER_STORE_VND:0}
    shipping-simulation-enabled: ${CHECKOUT_SHIPPING_SIMULATION_ENABLED:false}
  shipping:
    simulation-enabled: ${SHIPPING_SIMULATION_ENABLED:false}
    ghn-sandbox:
      token: ${GHN_SANDBOX_TOKEN:}
      shop-id: ${GHN_SANDBOX_SHOP_ID:0}
      store-id: ${GHN_SANDBOX_STORE_ID:}
      item-weight-grams: ${GHN_SANDBOX_ITEM_WEIGHT_GRAMS:300}
      length-cm: ${GHN_SANDBOX_PARCEL_LENGTH_CM:25}
      width-cm: ${GHN_SANDBOX_PARCEL_WIDTH_CM:20}
      height-cm: ${GHN_SANDBOX_PARCEL_HEIGHT_CM:8}
