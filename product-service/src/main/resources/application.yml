server:
  port: ${SERVER_PORT:8082}

spring:
  config:
    import: optional:file:.env[.properties],optional:file:product-service/.env[.properties]
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${PRODUCT_DB_PORT:5437}/${PRODUCT_DB_NAME:product_db}}
    username: ${DB_USERNAME:${POSTGRES_USER:postgres}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/scanms}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

clients:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8083}
  promotion:
    url: ${PROMOTION_SERVICE_URL:http://localhost:8085}
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8000}
