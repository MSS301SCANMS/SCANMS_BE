server:
  port: ${SERVER_PORT:8082}

scanms:
  catalog:
    seed-enabled: ${CATALOG_SEED_ENABLED:true}
    sora-seed-enabled: ${SORA_CATALOG_SEED_ENABLED:true}
    sora-owner-user-id: ${SORA_SEED_OWNER_USER_ID:3ecf64b8-5c15-4f74-9690-57707ada1104}
    cache-enabled: ${CATALOG_CACHE_ENABLED:true}

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties],optional:file:product-service/.env[.properties]
  application:
    name: product-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Timeout ngắn: Redis lỗi thì cache bị bỏ qua nhanh, request vẫn đọc DB.
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${PRODUCT_DB_PORT:5437}/${PRODUCT_DB_NAME:product_db}}
    username: ${DB_USERNAME:${POSTGRES_USER:postgres}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/scanms}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

clients:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8083}
  promotion:
    url: ${PROMOTION_SERVICE_URL:http://localhost:8085}
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8000}
