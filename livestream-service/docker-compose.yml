services:
  livestream-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${LIVESTREAM_DB_NAME:-livestream_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${LIVESTREAM_DB_PORT:-5437}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - livestream-db-data:/var/lib/postgresql/data

volumes:
  livestream-db-data:
